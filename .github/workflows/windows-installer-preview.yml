name: IOS8 Windows Installer Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-preview.yml"
      - ".gitmodules"
      - "lib/**"
      - "windows/**"
      - "hiddify-core"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios8-windows-installer-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build unsigned Windows x64 installer (preview)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CHANNEL: prod
      IS_GITHUB_ACTIONS: 1
    steps:
      # Windows uses the pinned prebuilt core release assets downloaded by windows-prepare.
      # The hiddify-core source submodule is not needed for this platform build.
      - name: Check out IOS8 VPN source
        uses: actions/checkout@v6

      - name: Set up Flutter and Windows build dependencies
        uses: ./.github/actions/setup-flutter
        with:
          platform: windows
          generated-code: false
          install-deps: true

      - name: Validate Windows release build
        run: make windows-validate

      - name: Package unsigned Windows installer
        run: make windows-exe-release

      - name: Verify real installer shortcuts and overwrite repair
        shell: pwsh
        run: ./windows/scripts/test_ios8_installer.ps1

      - name: Verify installer output
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Recurse -File -Filter '*.exe'
          if (-not $files) {
            throw 'No Windows installer EXE was produced under dist/.'
          }
          $files | ForEach-Object {
            $signature = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host "$($_.FullName) | Signature: $($signature.Status)"
          }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $installer = $files | Where-Object { $_.Name -match 'Setup.*x64.*\.exe$' } | Select-Object -First 1
          if (-not $installer) { $installer = $files | Select-Object -First 1 }
          Copy-Item $installer.FullName (Join-Path out 'IOS8-VPN-Windows-x64-Preview-Unsigned.exe')
          Get-FileHash (Join-Path out 'IOS8-VPN-Windows-x64-Preview-Unsigned.exe') -Algorithm SHA256

      - name: Upload preview installer
        uses: actions/upload-artifact@v6
        with:
          name: ios8-vpn-windows-preview-unsigned
          path: out/IOS8-VPN-Windows-x64-Preview-Unsigned.exe
          retention-days: 14
          if-no-files-found: error
